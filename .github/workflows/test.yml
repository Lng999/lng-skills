name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        # macos: sistemin /bin/bash 3.2'si + BSD araclari; windows: Git Bash.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: for f in sync.sh skills/*/hooks/*.sh tests/*.sh; do bash -n "$f" || exit 1; done

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s bash sync.sh skills/*/hooks/*.sh tests/*.sh

      - name: Hook tests
        if: runner.os != 'macOS'
        run: bash tests/hooks.sh

      - name: Hook tests (/bin/bash 3.2)
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash tests/hooks.sh
